# Fly config for the Hive mission coordinator.
#   flyctl deploy --config deploy/fly/coordinator.fly.toml \
#                 --build-arg SERVICE=apps/coordinator \
#                 --dockerfile deploy/fly/Dockerfile.ts-app
#
# Like the dispatcher, this holds one blocking Redis consumer group per running
# mission — only ONE instance should run. Scaling past 1 would split each
# mission's board between two coordinators, and each would decide on half the
# evidence. auto_stop_machines is disabled and min_machines_running is 1.
#
# Needs ANTHROPIC_API_KEY set as a secret; without it the service reconciles
# missions but /healthz reports `model: not ok` and no decision is ever made.

app = "hive-coordinator"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile.ts-app"

[build.args]
  SERVICE = "apps/coordinator"

[env]
  NODE_ENV         = "production"
  COORDINATOR_PORT = "4200"
  HIVE_ENV_LABEL   = "production"

[http_service]
  internal_port        = 4200
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval     = "30s"
  method       = "GET"
  path         = "/healthz"
  protocol     = "http"
  timeout      = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
